<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a5c"/>
      <stop offset="1" stop-color="#061631"/>
    </linearGradient>
    <linearGradient id="lite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd0ff"/>
      <stop offset="1" stop-color="#3f8cf0"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9bff"/>
      <stop offset="1" stop-color="#2160c9"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a63c4"/>
      <stop offset="1" stop-color="#123c8a"/>
    </linearGradient>
  </defs>

  <!-- Background tile so the mark reads on light and dark tabs -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Left arm: front face + shaded inner bevel -->
  <polygon points="7,16 19,16 33,49 27,49" fill="url(#lite)"/>
  <polygon points="19,16 22,19 34.5,47 33,49" fill="url(#dark)"/>

  <!-- Inner stroke (the "L") -->
  <polygon points="23,16 29,16 38,36 35,41" fill="url(#mid)"/>

  <!-- Right arm: body + lit top face -->
  <polygon points="33,49 50,17 56,17 39,49" fill="url(#mid)"/>
  <polygon points="48,14 58,14 56,17 50,17" fill="url(#lite)"/>
</svg>
