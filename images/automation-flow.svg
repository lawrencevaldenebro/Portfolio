<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" aria-label="Automation flow illustration">
  <defs>
    <linearGradient id="afNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12305e"/>
      <stop offset="100%" stop-color="#0a1c36"/>
    </linearGradient>
    <linearGradient id="afStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="50%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <linearGradient id="afLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7b61ff" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="afGlow">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flow { stroke-dasharray: 9 11; animation: dash 2.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -40; } }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:.9 } }
      .bob  { animation: bob 4s ease-in-out infinite; }
      .bob2 { animation: bob 4s ease-in-out infinite; animation-delay: -1.3s; }
      .bob3 { animation: bob 4s ease-in-out infinite; animation-delay: -2.2s; }
      .bob4 { animation: bob 4s ease-in-out infinite; animation-delay: -3.1s; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .lbl  { font: 700 11.5px 'Inter', sans-serif; fill: #dceaff; }
      .sub  { font: 500 8.8px 'Inter', sans-serif; fill: #86a8d8; }
      .tiny { font: 600 8.5px 'Inter', sans-serif; fill: #9fc4ea; }
    </style>
  </defs>

  <ellipse cx="310" cy="175" rx="295" ry="118" fill="url(#afGlow)" class="pulse"/>

  <!-- connectors -->
  <g stroke="url(#afLine)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path class="flow" d="M160 117 C 186 117, 192 148, 212 160"/>
    <path class="flow" d="M160 231 C 186 231, 192 202, 212 190"/>
    <path class="flow" d="M340 174 H368"/>
    <path class="flow" d="M544 174 H558"/>
  </g>

  <!-- sources -->
  <g class="bob">
    <rect x="18" y="88" width="142" height="58" rx="15" fill="url(#afNode)" stroke="url(#afStroke)" stroke-width="1.4"/>
    <circle cx="44" cy="117" r="10" fill="none" stroke="#4cc9f0" stroke-width="2"/>
    <path d="M39.5 117 l3.2 3.2 l6.3 -7.2" stroke="#4cc9f0" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="114" class="lbl">Landing Page</text>
    <text x="66" y="128" class="sub">forms · booking</text>
  </g>

  <g class="bob2">
    <rect x="18" y="202" width="142" height="58" rx="15" fill="url(#afNode)" stroke="url(#afStroke)" stroke-width="1.4"/>
    <rect x="35" y="224" width="18" height="14" rx="3" fill="none" stroke="#7b61ff" stroke-width="2"/>
    <path d="M35 227 l9 6 l9 -6" stroke="#7b61ff" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="228" class="lbl">Ads / Email</text>
    <text x="66" y="242" class="sub">inbound leads</text>
  </g>

  <!-- CRM hub -->
  <g class="bob3">
    <rect x="212" y="142" width="128" height="64" rx="16" fill="url(#afNode)" stroke="url(#afStroke)" stroke-width="1.6"/>
    <circle cx="238" cy="174" r="10" fill="none" stroke="#4cc9f0" stroke-width="2"/>
    <circle cx="238" cy="174" r="3.5" fill="#4cc9f0"/>
    <text x="260" y="171" class="lbl">CRM</text>
    <text x="260" y="185" class="sub">tag + route</text>
  </g>

  <!-- workflow: more than if/then -->
  <g class="bob4">
    <rect x="368" y="132" width="176" height="84" rx="18" fill="url(#afNode)" stroke="url(#afStroke)" stroke-width="1.8"/>

    <!-- multi-branch icon -->
    <g stroke="#7b61ff" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M386 174 h9"/>
      <path d="M395 174 C 402 174, 402 159, 409 159"/>
      <path d="M395 174 H409"/>
      <path d="M395 174 C 402 174, 402 189, 409 189"/>
    </g>
    <circle cx="386" cy="174" r="2.6" fill="#7b61ff"/>
    <circle cx="410" cy="159" r="2.4" fill="#4cc9f0"/>
    <circle cx="410" cy="174" r="2.4" fill="#4cc9f0"/>
    <circle cx="410" cy="189" r="2.4" fill="#4cc9f0"/>

    <text x="424" y="158" class="lbl">Workflow</text>
    <text x="424" y="173" class="sub">triggers · conditions</text>
    <text x="424" y="186" class="sub">lead scoring · tagging</text>
    <text x="424" y="199" class="sub">email &amp; SMS nurture</text>
  </g>

  <!-- outcome -->
  <g class="bob">
    <rect x="558" y="146" width="52" height="58" rx="15" fill="url(#afNode)" stroke="url(#afStroke)" stroke-width="1.8"/>
    <path d="M570 176 l6 -7 l5.5 5.5 l8 -11" stroke="#4cc9f0" stroke-width="2.4" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="584" y="194" text-anchor="middle" class="tiny">converted</text>
  </g>

  <!-- travelling packets -->
  <circle r="3.5" fill="#8ee3ff">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M160 117 C 186 117, 192 148, 212 160"/>
  </circle>
  <circle r="3.5" fill="#a78bff">
    <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M160 231 C 186 231, 192 202, 212 190"/>
  </circle>
  <circle r="3.5" fill="#8ee3ff">
    <animateMotion dur="2.2s" begin="0.6s" repeatCount="indefinite" path="M340 174 H368"/>
  </circle>
  <circle r="4" fill="#4cc9f0">
    <animateMotion dur="1.6s" begin="1.4s" repeatCount="indefinite" path="M544 174 H558"/>
  </circle>
</svg>
