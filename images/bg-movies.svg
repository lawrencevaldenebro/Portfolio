<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <filter id="mvBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="mvSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <linearGradient id="mvScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bcaaff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#5b3fd6" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="mvBeam" cx="50%" cy="0%">
      <stop offset="0%" stop-color="#d9ccff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#d9ccff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- projector beam -->
  <path d="M200 -10 L400 190 L0 190 Z" fill="url(#mvBeam)" opacity=".55"/>

  <!-- bank of cinema screens, blurred back layer -->
  <g filter="url(#mvBlur)" opacity=".6">
    <rect x="12"  y="40"  width="126" height="76" rx="6" fill="url(#mvScreen)"/>
    <rect x="158" y="22"  width="150" height="90" rx="6" fill="#7b61ff" opacity=".8"/>
    <rect x="322" y="52"  width="102" height="62" rx="6" fill="#bcaaff" opacity=".55"/>
    <rect x="-8"  y="146" width="132" height="80" rx="6" fill="#6a5cff" opacity=".7"/>
    <rect x="146" y="140" width="118" height="72" rx="6" fill="#bcaaff" opacity=".5"/>
    <rect x="286" y="158" width="128" height="78" rx="6" fill="#7b61ff" opacity=".6"/>
  </g>

  <!-- crisp hero screen -->
  <g filter="url(#mvSoft)">
    <rect x="104" y="88" width="180" height="108" rx="8" fill="none" stroke="#d9ccff"
          stroke-width="2.5" opacity=".6"/>
    <rect x="104" y="88" width="180" height="108" rx="8" fill="#bcaaff" opacity=".12"/>
  </g>

  <!-- film strip perforations top + bottom -->
  <g fill="#e6ddff" opacity=".18">
    <rect x="6"   y="4" width="14" height="10" rx="2"/><rect x="38"  y="4" width="14" height="10" rx="2"/>
    <rect x="70"  y="4" width="14" height="10" rx="2"/><rect x="102" y="4" width="14" height="10" rx="2"/>
    <rect x="134" y="4" width="14" height="10" rx="2"/><rect x="166" y="4" width="14" height="10" rx="2"/>
    <rect x="198" y="4" width="14" height="10" rx="2"/><rect x="230" y="4" width="14" height="10" rx="2"/>
    <rect x="262" y="4" width="14" height="10" rx="2"/><rect x="294" y="4" width="14" height="10" rx="2"/>
    <rect x="326" y="4" width="14" height="10" rx="2"/><rect x="358" y="4" width="14" height="10" rx="2"/>

    <rect x="6"   y="286" width="14" height="10" rx="2"/><rect x="38"  y="286" width="14" height="10" rx="2"/>
    <rect x="70"  y="286" width="14" height="10" rx="2"/><rect x="102" y="286" width="14" height="10" rx="2"/>
    <rect x="134" y="286" width="14" height="10" rx="2"/><rect x="166" y="286" width="14" height="10" rx="2"/>
    <rect x="198" y="286" width="14" height="10" rx="2"/><rect x="230" y="286" width="14" height="10" rx="2"/>
    <rect x="262" y="286" width="14" height="10" rx="2"/><rect x="294" y="286" width="14" height="10" rx="2"/>
    <rect x="326" y="286" width="14" height="10" rx="2"/><rect x="358" y="286" width="14" height="10" rx="2"/>
  </g>
</svg>
