<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <filter id="muBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="muSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="muBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1ed760" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#5ce0ff" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <!-- vinyl rings, blurred -->
  <g filter="url(#muBlur)" opacity=".5">
    <circle cx="316" cy="80" r="70" fill="none" stroke="#3a86ff" stroke-width="16"/>
    <circle cx="316" cy="80" r="40" fill="none" stroke="#1ed760" stroke-width="10" opacity=".7"/>
    <circle cx="70" cy="232" r="56" fill="none" stroke="#4cc9f0" stroke-width="14" opacity=".6"/>
  </g>

  <!-- equalizer bars -->
  <g filter="url(#muSoft)" opacity=".62">
    <rect x="16"  y="150" width="16" height="108" rx="8" fill="url(#muBar)"/>
    <rect x="42"  y="104" width="16" height="154" rx="8" fill="url(#muBar)"/>
    <rect x="68"  y="176" width="16" height="82"  rx="8" fill="url(#muBar)"/>
    <rect x="94"  y="72"  width="16" height="186" rx="8" fill="url(#muBar)"/>
    <rect x="120" y="140" width="16" height="118" rx="8" fill="url(#muBar)"/>
    <rect x="146" y="96"  width="16" height="162" rx="8" fill="url(#muBar)"/>
    <rect x="172" y="184" width="16" height="74"  rx="8" fill="url(#muBar)"/>
    <rect x="198" y="120" width="16" height="138" rx="8" fill="url(#muBar)"/>
    <rect x="224" y="60"  width="16" height="198" rx="8" fill="url(#muBar)"/>
    <rect x="250" y="158" width="16" height="100" rx="8" fill="url(#muBar)"/>
    <rect x="276" y="112" width="16" height="146" rx="8" fill="url(#muBar)"/>
    <rect x="302" y="190" width="16" height="68"  rx="8" fill="url(#muBar)"/>
    <rect x="328" y="132" width="16" height="126" rx="8" fill="url(#muBar)"/>
    <rect x="354" y="88"  width="16" height="170" rx="8" fill="url(#muBar)"/>
  </g>
</svg>
