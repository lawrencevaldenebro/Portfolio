<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <filter id="shBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <linearGradient id="shScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#1b6fd6" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <!-- wall of screens, back layer heavily blurred -->
  <g filter="url(#shBlur)" opacity=".55">
    <rect x="18" y="26" width="104" height="66" rx="9" fill="url(#shScreen)"/>
    <rect x="150" y="14" width="120" height="76" rx="9" fill="#3a86ff" opacity=".75"/>
    <rect x="296" y="34" width="92" height="58" rx="9" fill="#4cc9f0" opacity=".6"/>
    <rect x="8" y="120" width="118" height="74" rx="9" fill="#2f7ae0" opacity=".7"/>
    <rect x="158" y="112" width="104" height="66" rx="9" fill="#4cc9f0" opacity=".5"/>
    <rect x="286" y="126" width="110" height="70" rx="9" fill="#3a86ff" opacity=".65"/>
    <rect x="40" y="216" width="112" height="70" rx="9" fill="#4cc9f0" opacity=".45"/>
    <rect x="186" y="222" width="126" height="72" rx="9" fill="#2f7ae0" opacity=".55"/>
  </g>

  <!-- crisper foreground screens -->
  <g filter="url(#shSoft)" fill="none" stroke="#9fdcff" stroke-width="2" opacity=".5">
    <rect x="88" y="70" width="128" height="80" rx="10"/>
    <rect x="232" y="150" width="112" height="70" rx="10"/>
  </g>

  <!-- scanlines -->
  <g stroke="#bfe6ff" stroke-width="1" opacity=".07">
    <path d="M0 40 H400 M0 80 H400 M0 120 H400 M0 160 H400 M0 200 H400 M0 240 H400 M0 280 H400"/>
  </g>
</svg>
