<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" role="img" aria-label="Ghost of Tsushima tile">
  <defs>
    <linearGradient id="gotbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a0f14"/>
      <stop offset="55%" stop-color="#1a0a12"/>
      <stop offset="100%" stop-color="#080409"/>
    </linearGradient>
    <radialGradient id="gotsun" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ff7a52"/>
      <stop offset="70%" stop-color="#e03a2f"/>
      <stop offset="100%" stop-color="#a81f22"/>
    </radialGradient>
    <radialGradient id="gotglow" cx="50%" cy="38%">
      <stop offset="0%" stop-color="#ff8a5c" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="150" rx="8" fill="url(#gotbg)"/>
  <rect width="100" height="150" rx="8" fill="url(#gotglow)"/>

  <!-- rising sun -->
  <circle cx="50" cy="56" r="26" fill="url(#gotsun)"/>

  <!-- katana silhouette across the sun -->
  <path d="M22 88 L78 30" stroke="#f4e3c8" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M70 38 l7 -7" stroke="#c9a25a" stroke-width="4" stroke-linecap="round"/>

  <!-- drifting ginkgo leaves -->
  <g fill="#f0b264" opacity=".9">
    <ellipse cx="24" cy="40" rx="4" ry="2.6" transform="rotate(-28 24 40)"/>
    <ellipse cx="80" cy="66" rx="3.4" ry="2.2" transform="rotate(22 80 66)"/>
    <ellipse cx="30" cy="70" rx="3" ry="2" transform="rotate(-14 30 70)"/>
  </g>

  <text x="50" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5"
        font-weight="900" fill="#f4d9b0" letter-spacing="1.2">TSUSHIMA</text>
  <rect x="32" y="130" width="36" height="2.5" rx="1.2" fill="#e03a2f" opacity=".85"/>
</svg>
