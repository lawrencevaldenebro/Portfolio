<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" role="img" aria-label="Sekiro tile">
  <defs>
    <linearGradient id="skbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2026"/>
      <stop offset="100%" stop-color="#07090c"/>
    </linearGradient>
    <radialGradient id="skmoon" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="100%" stop-color="#cbbfa4"/>
    </radialGradient>
    <radialGradient id="skglow" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#e8dcc0" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#e8dcc0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="150" rx="8" fill="url(#skbg)"/>
  <rect width="100" height="150" rx="8" fill="url(#skglow)"/>

  <!-- pale moon -->
  <circle cx="50" cy="52" r="23" fill="url(#skmoon)" opacity=".92"/>
  <circle cx="41" cy="45" r="3.5" fill="#0d0f12" opacity=".08"/>
  <circle cx="58" cy="60" r="4.5" fill="#0d0f12" opacity=".07"/>

  <!-- crossed blade + prosthetic hook -->
  <path d="M24 92 L74 42" stroke="#0d0f12" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>
  <path d="M26 90 L72 44" stroke="#dfe6ee" stroke-width="2" stroke-linecap="round"/>
  <path d="M76 40 a7 7 0 1 0 -9 -3" fill="none" stroke="#c0392b" stroke-width="3"
        stroke-linecap="round"/>

  <!-- blood accent -->
  <circle cx="34" cy="82" r="2.6" fill="#c0392b"/>
  <circle cx="28" cy="90" r="1.6" fill="#c0392b" opacity=".8"/>

  <text x="50" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="12"
        font-weight="900" fill="#e4e9f0" letter-spacing="2.5">SEKIRO</text>
  <rect x="32" y="130" width="36" height="2.5" rx="1.2" fill="#c0392b" opacity=".85"/>
</svg>
