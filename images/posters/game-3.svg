<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" role="img" aria-label="Assassin's Creed Black Flag tile">
  <defs>
    <linearGradient id="acbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06303a"/>
      <stop offset="60%" stop-color="#04202c"/>
      <stop offset="100%" stop-color="#020d14"/>
    </linearGradient>
    <radialGradient id="acglow" cx="50%" cy="38%">
      <stop offset="0%" stop-color="#39d6c8" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#39d6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e6d78"/>
      <stop offset="100%" stop-color="#05323f"/>
    </linearGradient>
  </defs>

  <rect width="100" height="150" rx="8" fill="url(#acbg)"/>
  <rect width="100" height="150" rx="8" fill="url(#acglow)"/>

  <!-- ship: hull, masts, sails -->
  <g stroke="#0a2733" stroke-width="1">
    <path d="M50 24 V78" stroke="#e8dcc0" stroke-width="2.4"/>
    <path d="M50 30 q16 12 0 20 z" fill="#e8dcc0" opacity=".92"/>
    <path d="M50 30 q-16 12 0 20 z" fill="#cdbfa0" opacity=".85"/>
    <path d="M50 54 q13 9 0 15 z" fill="#e8dcc0" opacity=".8"/>
    <path d="M50 54 q-13 9 0 15 z" fill="#cdbfa0" opacity=".72"/>
  </g>
  <path d="M28 78 h44 l-8 12 H36 Z" fill="#3a2416" stroke="#c9a25a" stroke-width="1.4"/>

  <!-- black flag -->
  <path d="M50 24 h14 l-4 4 4 4 h-14 z" fill="#0b0f12"/>

  <!-- sea -->
  <path d="M8 100 q12 -6 22 0 t22 0 t22 0 t18 0 V142 H8 Z" fill="url(#acsea)" opacity=".95"/>
  <path d="M10 106 q12 -5 24 0 t24 0 t22 0" fill="none" stroke="#5fe4d4" stroke-width="1.6"
        opacity=".55"/>

  <text x="50" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="10"
        font-weight="900" fill="#bff0e6" letter-spacing="1.2">BLACK FLAG</text>
  <rect x="32" y="135" width="36" height="2.5" rx="1.2" fill="#39d6c8" opacity=".8"/>
</svg>
