<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" role="img" aria-label="Interstellar tile">
  <defs>
    <radialGradient id="inSpace" cx="50%" cy="42%">
      <stop offset="0%" stop-color="#16233d"/>
      <stop offset="100%" stop-color="#03060d"/>
    </radialGradient>
    <linearGradient id="inDisc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb44d"/>
      <stop offset="50%" stop-color="#ffe6b0"/>
      <stop offset="100%" stop-color="#e8892b"/>
    </linearGradient>
  </defs>

  <rect width="100" height="150" rx="8" fill="url(#inSpace)"/>

  <!-- stars -->
  <g fill="#dce8ff">
    <circle cx="16" cy="22" r="1.1" opacity=".9"/><circle cx="82" cy="18" r=".9" opacity=".7"/>
    <circle cx="30" cy="112" r="1" opacity=".8"/><circle cx="72" cy="124" r=".8" opacity=".6"/>
    <circle cx="90" cy="96" r="1" opacity=".75"/><circle cx="10" cy="74" r=".8" opacity=".6"/>
    <circle cx="58" cy="14" r="1" opacity=".65"/>
  </g>

  <!-- accretion disc (edge-on, lensed over the top) -->
  <ellipse cx="50" cy="66" rx="38" ry="8" fill="none" stroke="url(#inDisc)" stroke-width="4"/>
  <path d="M12 66 a38 34 0 0 1 76 0" fill="none" stroke="url(#inDisc)" stroke-width="3.4"
        opacity=".95"/>
  <!-- event horizon -->
  <circle cx="50" cy="66" r="17" fill="#03060d"/>
  <circle cx="50" cy="66" r="17.5" fill="none" stroke="#ffd79a" stroke-width="1.2" opacity=".5"/>

  <!-- ranger ship -->
  <g fill="#cfe0ff" opacity=".95">
    <rect x="24" y="40" width="9" height="3.2" rx="1.6" transform="rotate(-18 24 40)"/>
  </g>

  <text x="50" y="126" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.6"
        font-weight="900" fill="#ffdba8" letter-spacing="1.4">INTERSTELLAR</text>
  <rect x="32" y="133" width="36" height="2.5" rx="1.2" fill="#e8892b" opacity=".8"/>
</svg>
