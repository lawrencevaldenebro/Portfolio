<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" role="img" aria-label="The Dark Knight tile">
  <defs>
    <linearGradient id="dkbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2634"/>
      <stop offset="60%" stop-color="#0a121b"/>
      <stop offset="100%" stop-color="#04070b"/>
    </linearGradient>
    <radialGradient id="dkGlow" cx="50%" cy="34%">
      <stop offset="0%" stop-color="#8fb6dd" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#8fb6dd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="150" rx="8" fill="url(#dkbg)"/>
  <rect width="100" height="150" rx="8" fill="url(#dkGlow)"/>

  <!-- searchlight cone -->
  <path d="M50 40 L88 6 L12 6 Z" fill="#cfe2f5" opacity=".07"/>

  <!-- bat silhouette -->
  <path d="M50 44
           L60 52 L66 47 L64 56 L76 54 L70 62 L84 66
           L70 70 L74 78 L62 74 L58 82 L50 72
           L42 82 L38 74 L26 78 L30 70 L16 66
           L30 62 L24 54 L36 56 L34 47 L40 52 Z"
        fill="#e8f0fa" opacity=".93"/>

  <!-- gotham skyline -->
  <g fill="#050a10">
    <rect x="6"  y="104" width="14" height="42"/>
    <rect x="23" y="94"  width="11" height="52"/>
    <rect x="37" y="112" width="13" height="34"/>
    <rect x="53" y="98"  width="12" height="48"/>
    <rect x="68" y="108" width="10" height="38"/>
    <rect x="81" y="92"  width="13" height="54"/>
  </g>
  <g fill="#8fb6dd" opacity=".5">
    <rect x="9"  y="110" width="3" height="4"/><rect x="26" y="100" width="3" height="4"/>
    <rect x="41" y="118" width="3" height="4"/><rect x="57" y="104" width="3" height="4"/>
    <rect x="71" y="114" width="3" height="4"/><rect x="85" y="98"  width="3" height="4"/>
  </g>

  <text x="50" y="136" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.4"
        font-weight="900" fill="#c3d9ef" letter-spacing="1.2">DARK KNIGHT</text>
</svg>
