<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" role="img" aria-label="Good Will Hunting tile">
  <defs>
    <linearGradient id="gwbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3320"/>
      <stop offset="100%" stop-color="#0a1410"/>
    </linearGradient>
    <radialGradient id="gwLamp" cx="50%" cy="16%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="150" rx="8" fill="url(#gwbg)"/>
  <rect width="100" height="150" rx="8" fill="url(#gwLamp)"/>

  <!-- chalkboard -->
  <rect x="12" y="28" width="76" height="74" rx="3" fill="#16281a" stroke="#c8a86a"
        stroke-width="2.5"/>

  <!-- chalk equations -->
  <g stroke="#eae4d0" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M20 42 h16"/>
    <path d="M22 38 q6 -6 12 0"/>
    <path d="M42 44 l6 -8 M42 36 l6 8"/>
    <path d="M56 36 v10 M56 41 h8 M64 36 v10"/>
    <path d="M20 58 q8 -8 16 0 t16 0"/>
    <path d="M58 54 h14 M58 60 h10"/>
    <path d="M20 74 c6 -10 12 10 18 0"/>
    <path d="M44 70 v10 M44 70 h8 a4 4 0 0 1 0 8 h-8"/>
    <path d="M60 70 l12 10 M72 70 l-12 10"/>
    <path d="M20 90 h20 M46 86 v8 M46 90 h9"/>
    <circle cx="70" cy="90" r="4"/>
  </g>

  <!-- chalk tray + chalk -->
  <rect x="12" y="102" width="76" height="4" rx="2" fill="#c8a86a" opacity=".85"/>
  <rect x="60" y="98" width="10" height="3" rx="1.5" fill="#f2ede0"/>

  <text x="50" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="9"
        font-weight="900" fill="#e6dcbe" letter-spacing=".6">GOOD WILL</text>
  <text x="50" y="133" text-anchor="middle" font-family="Inter, sans-serif" font-size="9"
        font-weight="900" fill="#e6dcbe" letter-spacing=".6">HUNTING</text>
  <rect x="34" y="139" width="32" height="2.4" rx="1.2" fill="#7fbf6a" opacity=".8"/>
</svg>
