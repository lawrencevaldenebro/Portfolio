<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150" role="img" aria-label="Brooklyn Nine-Nine tile">
  <defs>
    <linearGradient id="b99bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2a5c"/>
      <stop offset="100%" stop-color="#05132b"/>
    </linearGradient>
    <linearGradient id="b99gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd97a"/>
      <stop offset="100%" stop-color="#e0a11c"/>
    </linearGradient>
